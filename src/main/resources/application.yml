server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Tomcat's own limit (default 2MB) also caps multipart POST bodies, independent of
    # spring.servlet.multipart.* — raise it to match the 100MB upload limits below.
    max-http-form-post-size: 100MB
    # Boot 4.0.3 hardens server.tomcat.max-part-count default to 10: any multipart
    # request with more than 10 parts (fields + files) is rejected with a misleading
    # 413 "Maximum upload size exceeded". The riwayat-sp form alone has 11+ fields.
    max-part-count: 1000
    # Default 2MB swallow cap resets the connection for uploads far exceeding the
    # limits above; raise it so the client gets a clean 413 ProblemDetail instead.
    max-swallow-size: 100MB

spring:
  devtools:
    restart:
      enabled: ${DEVELOPMENT:false}
  profiles:
    active: ${PROFILE:development}
  main:
    banner-mode: off
  application:
    name: kepegawaian
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:mariadb://${DB_HOST:192.168.230.84}:${DB_PORT:3307}/${DB_SCHEMA:kepegawaian_dev_new}?useSSL=false&zeroDateTimeBehavior=convertToNull&useLegacyDatetimeCode=false&server=mysql
    username: ${DB_USER:dev}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: true
#        dialect: org.hibernate.dialect.MariaDBDialect
        column_ordering_strategy: legacy
  #      org:
  #        hibernate:
  #          envers:
  #            audit_table_suffix: _aud
  #            revision_field_name: rev
  #            revision_type_field_name: revtype
  #            store_data_at_delete: true
  #      javax:
  #        persistence:
  #          schema-generation:
  #            scripts:
  #              action: create
  #              create-target: create.sql
  #              create-source: metadata
  #              drop-target: drop.sql
  #              drop-source: metadata
  data:
    redis:
      host: ${REDIS_HOST:192.168.1.214}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_CACHE_TTL:600000}
      cache-null-values: false
      key-prefix: "kepegawaian:"
      use-key-prefix: true
  docker:
    compose:
      enabled: false

logging:
  # File logging bawaan Spring Boot (Logback): menulis ke file + console, rotasi otomatis.
  # LOG_FILE di-override saat deploy prod (mis. /var/log/kepegawaian/kepegawaian.log).
  file:
    name: ${LOG_FILE:logs/kepegawaian.log}
  logback:
    rollingpolicy:
      # Rotasi env-driven: ops bisa set tanpa rebuild. Default 50MB/file,
      # total disk 500MB (~10 file), retensi 30 hari, bersihkan file lama saat start.
      max-file-size: ${LOG_MAX_FILE_SIZE:50MB}
      max-history: 30
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:500MB}
      clean-history-on-start: true
  level:
    org:
      spring:
        security: INFO
      hibernate:
        sql: INFO

appwrite:
  endpoint: ${APPWRITE_ENDPOINT:http://192.168.230.254:82/v1}
  project_id: ${APPWRITE_PROJECT_ID:65cd62cc3385d8434a53}
  api_key: ${APPWRITE_API_KEY}

penggajian:
  endpoint: ${PENGGAJIAN_URL:http://192.168.1.214:81}
custom:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  jabatan:
    supervisorSdm: ${JABATAN_SUPERVISOR_SDM:49}

app:
  pegawai:
    excluded-jabatan-ids: 1,2,3,25
    excluded-golongan-statuses: KONTRAK,CALON_HONORER,HONORER
  cuti:
    jenis-cuti-tahunan: ${JENIS_CUTI_TAHUNAN:1}
    jenis-cuti-besar: ${JENIS_CUTI_BESAR:2}
    jenis-cuti-ibadah: ${JENIS_CUTI_IBADAH:4}
    supervisor-sdm: ${JABATAN_SUPERVISOR_SDM:49}
    manager-sdm: ${JABATAN_MANAGER_SDM:48}
    direktur-utama: ${JABATAN_DIREKTUR_UTAMA:2}
    direktur-umum: ${JABATAN_DIREKTUR_UMUM:25}
    level-supervisor: ${LEVEL_SUPERVISOR:6}
    level-manager: ${LEVEL_MANAGER:5}

---
# Level DEBUG/TRACE (verbose + berisi parameter SQL/PII) hanya untuk development;
# di prod log file bersih di level INFO.
spring:
  config:
    activate:
      on-profile: development
logging:
  level:
    # Nama logger HARUS lengkap (org.springframework.security, org.hibernate.SQL) —
    # kunci YAML terikat literal, versi singkat (org.spring.security) tidak pernah bekerja.
    org:
      springframework:
        security: DEBUG
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
#      jooq: TRACE


